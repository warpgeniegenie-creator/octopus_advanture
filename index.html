<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="문어가 되어 동해·서해·남해 바닷속을 헤쳐 나가는 해양생물 어드벤처 게임">
<meta name="theme-color" content="#061219">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>문어의 바다 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 기본 초기화 */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* Layout: single column — title, three sea cards drawn as water-column cross-sections, then the game stage with its controls */
:root{
  --bg:#061219; --panel:#0b1f2b; --panel2:#0f2836; --line:#1d3c4e; --fg:#e6f0f2; --mute:#8eacb8;
  --coral:#ee6a40; --ink:#140b1f; --east:#4b86d6; --west:#b39550; --south:#34bfa5; --danger:#ef5f50; --safe:#6cc28a;
  --font-d:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-b:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-b);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;padding-block:22px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
header h1{font-family:var(--font-d);font-weight:400;font-size:clamp(30px,5.2vw,46px);margin:0;line-height:1.1;text-wrap:balance}
header h1 span{color:var(--coral)}
header p{margin:0;color:var(--mute);max-width:65ch}
.seas{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.sea{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.column{height:104px;position:relative}
.column span{position:absolute;left:14px;font-size:11.5px;letter-spacing:.06em;color:#fff;text-shadow:0 1px 2px #0008}
.column .t{top:8px}.column .b{bottom:6px}
.sea .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.sea h2{font-family:var(--font-d);font-weight:400;font-size:28px;margin:0;line-height:1.1}
.sea h2 small{font-family:var(--font-b);font-size:13px;color:var(--mute);margin-left:8px;font-weight:600}
.sea .env{color:var(--mute);font-size:13.5px;margin:0}
.groups{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.grp{display:flex;gap:8px;align-items:baseline}
.grp b{flex:0 0 58px;font-weight:600;color:var(--mute);font-size:11.5px;letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.chip{border:1px solid var(--line);border-radius:999px;padding:0 8px;background:var(--panel2);white-space:nowrap}
.chip.atk{border-color:#a8473e;color:#ffb8ad}
.chip.pro{border-color:#3f8a5a;color:#b2ecc5}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;border:1px solid}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;color:#05131b;background:var(--fg)}
.btn:focus-visible,.pad button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.sea .btn{margin-top:auto}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
canvas{display:block;width:100%;aspect-ratio:16/9;max-width:100%;touch-action:none}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute)}
kbd{font-family:var(--font-b);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;color:var(--fg)}
.pad{display:none;justify-content:space-between;align-items:stretch;gap:12px;margin-top:12px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pad .dpad{display:grid;grid-template-columns:repeat(3,minmax(54px,66px));grid-template-rows:58px 58px;gap:6px}
.pad .act{display:grid;grid-template-columns:repeat(2,minmax(66px,82px));grid-template-rows:58px 58px;gap:8px}
.pad button{font:inherit;font-weight:700;font-size:17px;line-height:1.1;width:100%;height:100%;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.pad button small{display:block;font-size:10.5px;font-weight:600;color:var(--mute);margin-top:3px}
.pad .l{grid-column:1;grid-row:1/3}.pad .r{grid-column:2;grid-row:1/3}.pad .d{grid-column:2;grid-row:2}
.pad .jump{grid-column:1;grid-row:1/3;background:#173a4d;border-color:#27587a}
.pad .ink{grid-column:2;grid-row:1/3;background:#2a1b38;border-color:#4b3566}
.pad .sp{grid-column:3;grid-row:1/3;background:#2e2410;border-color:#5a4520;color:#bfa36a}
.pad .sp.ready{background:#d29a24;border-color:#f3c35a;color:#1a1005;box-shadow:0 0 16px rgba(240,184,74,.75)}
.pad .sp.ready small{color:#3a2808}
.pad button.on{background:var(--coral);border-color:var(--coral);color:#130a05}
.pad button.on small{color:#3a1a0c}
body.touch .pad,body.padOn .pad{display:flex}
body.touch .keys{display:none}
#game:fullscreen{background:var(--bg);padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));overflow:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{padding:8px 12px;font-size:14px}
#rotateHint{display:none;margin:0}
/* 휴대폰으로 게임 중: 화면 전체를 게임으로 채움 */
body.touch.playing{overflow:hidden;overscroll-behavior:none}
body.touch.playing header,body.touch.playing .src{display:none}
body.touch.playing #game{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body.touch.playing #game .bar{margin:0!important;padding:6px 10px;justify-content:center}
body.touch.playing .tools .btn{padding:6px 10px;font-size:12.5px}
body.touch.playing #game .stage{border-radius:0;border:0;flex:0 0 auto}
body.touch.playing .pad{margin:0;padding:10px 12px 14px;flex:1;align-items:center}
body.touch.playing .pad .dpad{grid-template-columns:repeat(2,minmax(64px,88px));grid-template-rows:72px 72px}
body.touch.playing .pad .act{grid-template-columns:repeat(3,minmax(80px,104px));grid-template-rows:72px 72px}
@media (orientation:portrait){
  body.touch.playing #rotateHint{display:block;text-align:center;color:var(--mute);font-size:13px;padding:8px 12px}
}
@media (orientation:landscape){
  body.touch.playing #game{display:block;padding:0}
  body.touch.playing #game .stage{position:absolute;top:0;bottom:0;left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px)}
  body.touch.playing #game canvas{width:100%;height:100%;aspect-ratio:auto}
  body.touch.playing #game .bar{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;padding:0}
  body.touch.playing .pad{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none;align-items:flex-end}
  body.touch.playing .pad>div{pointer-events:auto}
  body.touch.playing .pad button{background:rgba(6,20,28,0.4);border-color:rgba(255,255,255,0.3);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  body.touch.playing .pad .jump{background:rgba(20,70,95,0.5)}
  body.touch.playing .pad .ink{background:rgba(50,30,70,0.55)}
  body.touch.playing .pad button.on{background:rgba(238,106,64,0.85)}
  body.touch.playing .pad .sp{background:rgba(60,45,15,0.5)}
  body.touch.playing .pad .sp.ready{background:rgba(214,158,40,0.9)}
  body.touch.playing .pad .dpad{grid-template-columns:repeat(2,62px);grid-template-rows:60px 60px}
  body.touch.playing .pad .act{grid-template-columns:repeat(3,76px);grid-template-rows:60px 60px}
  body.touch.playing .tools .btn{background:rgba(6,20,28,0.5);border-color:rgba(255,255,255,0.28);color:#fff;padding:5px 9px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>문어의 <span>바다 모험</span></h1>
    <p>문어가 되어 동해·서해·남해 바닷속을 왼쪽에서 오른쪽으로 헤쳐 나가요. 먹물로 생물을 잡아먹고, 바위·산호·해양쓰레기를 피해 1단계 보스 거대 문어를 물리치세요.</p>
  </header>

  <section id="menu">
    <div class="seas" id="seas"></div>
    <div class="legend" style="margin-top:12px">
      <span><i style="border-color:#1d3c4e;background:#0f2836"></i>먹이 생물</span>
      <span><i style="border-color:#a8473e"></i>공격형 (닿으면 에너지 감소)</span>
      <span><i style="border-color:#3f8a5a"></i>해양보호생물 (먹물이 통하지 않아요)</span>
    </div>
  </section>

  <section id="game" hidden>
    <div class="bar" style="margin-bottom:10px">
      <div class="keys">
        <span><kbd>→</kbd> 앞으로</span><span><kbd>←</kbd> 뒤로</span>
        <span><kbd>↑</kbd>/<kbd>Space</kbd> 뛰기 (연타할수록 높이)</span>
        <span><kbd>F</kbd> 먹물 뿜기</span><span><kbd>G</kbd> 필살기</span><span><kbd>P</kbd> 일시정지</span>
      </div>
      <div class="tools">
        <button class="btn ghost" id="bPad" type="button">화면 버튼 보기</button>
        <button class="btn ghost" id="bFull" type="button" hidden>전체 화면</button>
        <button class="btn ghost" id="bPause" type="button">일시정지</button>
        <button class="btn ghost" id="bQuit" type="button">바다 고르기</button>
      </div>
    </div>
    <div class="stage"><canvas id="cv" width="960" height="540" aria-label="문어 어드벤처 게임 화면"></canvas></div>
    <p id="rotateHint">휴대폰을 가로로 돌리면 게임 화면이 꽉 차게 커져요</p>
    <div class="pad" aria-label="화면 조작 버튼">
      <div class="dpad">
        <button type="button" class="l" data-k="left" aria-label="뒤로">◀<small>뒤로</small></button>
        <button type="button" class="r" data-k="right" aria-label="앞으로">▶<small>앞으로</small></button>
      </div>
      <div class="act">
        <button type="button" class="jump" data-k="jump">뛰기<small>연타=더 높이</small></button>
        <button type="button" class="ink" data-k="ink">먹물<small>꾹 누르면 연사</small></button>
        <button type="button" class="sp" data-k="special" id="bSp">필살기<small>게이지 가득</small></button>
      </div>
    </div>
  </section>

  <section id="end" class="panel" hidden>
    <h2 id="endTitle">스테이지 클리어</h2>
    <p id="endMsg" style="margin:0;color:var(--mute)"></p>
    <div class="stats" id="endStats"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="bAgain" type="button">다시 하기</button>
      <button class="btn ghost" id="bMenu" type="button">다른 바다 고르기</button>
    </div>
    <h3 style="margin:6px 0 0;font-size:15px">이번 바다의 해양생물 도감</h3>
    <div class="dex" id="dex"></div>
  </section>

</div>

<script>
(()=>{
let W=960;const H=540,STAGE=7200;
const PS=1.7,CS=1.55,BS=3.4; // 문어·생물·보스 크기 배율
const $=s=>document.querySelector(s);
const cv=$('#cv');let ctx=cv.getContext('2d');
let DPR=1,HUDS=1;
function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const b=document.body.classList,playing=b.contains('playing')&&b.contains('touch');
  const r=cv.getBoundingClientRect();
  // 가로 화면이면 휴대폰 화면 비율에 맞춰 게임 폭을 넓혀요 (늘어나거나 잘리지 않게)
  W=(playing&&innerWidth>innerHeight&&r.height>0)?Math.round(Math.min(1400,Math.max(800,540*r.width/r.height))):960;
  cv.width=W*DPR;cv.height=H*DPR;
  // 작은 화면에서도 글씨가 읽히도록 HUD를 키워요
  HUDS=(playing&&r.height>0)?Math.min(1.8,Math.max(1,0.95*540/r.height)):1;
}
fit();
window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.ResizeObserver)new ResizeObserver(()=>fit()).observe(cv);
const R=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function srand(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

   hp: 먹물 몇 방에 쓰러지는지 · food: 먹었을 때 오르는 에너지 · w8: 출현 빈도 */

  meter:'수심 약 150m · 저층 수온 2℃',ground:468,top:40,surface:30,accent:'#4b86d6',
  col:'linear-gradient(180deg,#c4e8fa 0 12%,#43a6e6 12%,#2584d2 40%,#114f98 84%,#6d7f8d 84%)',colT:'표층 12℃',colB:'수심 150m · 바위 바닥',
  obs:['rock','rock','rock'],
  sp:[
   {n:'살오징어',cat:'연체동물',shape:'squid',mv:'swim',hp:3,food:10,spd:1.8,w:58,h:22,c1:'#efd0bc',c2:'#c0674a',w8:3,fact:'동해 대표 어종이었지만 수온이 오르며 어군이 북쪽으로 옮겨가 어획량이 크게 줄었어요.'},
   {n:'명태',cat:'어류',shape:'fish',mv:'swim',hp:3,food:10,spd:1.3,w:60,h:20,c1:'#a3aeb3',c2:'#56636b',w8:2,fact:'찬물을 좋아하는 한류성 어종. 1982년엔 동해 깊은 곳 어획물의 85%가 명태였지만 지금은 거의 사라졌어요.'},

   {n:'청어',cat:'어류',shape:'fish',mv:'school',hp:1,food:4,spd:2.0,w:26,h:10,c1:'#bfd5e0',c2:'#3a6c8a',w8:2,fact:'한류성 어류로, 최근 동해에서 어획량이 늘고 있어요.'},
   {n:'기름가자미',cat:'어류',shape:'flat',mv:'ground',hp:2,food:8,spd:0.4,w:56,h:13,c1:'#7d6f55',c2:'#4c4232',w8:2,fact:'바닥에 납작 붙어 사는 가자미. 1990년대 동해 깊은 곳의 대표 어종이었어요.'},
   {n:'임연수어',cat:'어류',shape:'fish',mv:'swim',hp:3,food:9,spd:1.4,w:52,h:19,c1:'#ccb77c',c2:'#575838',w8:1,fact:'한류성 어종으로 수온 상승과 함께 어획량이 줄고 있어요.'},
   {n:'대게',cat:'갑각류',shape:'crab',mv:'crawl',aggr:1,atk:10,hp:5,food:14,spd:0.7,w:64,h:30,c1:'#c9764a',c2:'#8c4729',w8:3,fact:'2000년대 동해 깊은 바다의 최우점종. 긴 다리와 집게로 공격해요.'},

 west:{key:'west',name:'서해',tag:'넓은 갯벌의 바다',

  obs:['rock','shells','rock'],
  sp:[

const keys={left:0,right:0,down:0};let jumpQ=0,inkQ=0,inkHold=0,specialQ=0;

addEventListener('keydown',e=>{
  if(!G||$('#game').hidden)return;
  const k=KMAP[e.code];
  if(k){keys[k]=1;e.preventDefault();}
  else if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){if(!e.repeat)jumpQ++;e.preventDefault();}
  else if(e.code==='KeyF'||e.code==='KeyJ'||e.code==='KeyK'){if(!e.repeat)inkQ++;inkHold=1;e.preventDefault();}
  else if(e.code==='KeyG'||e.code==='KeyE'){if(!e.repeat)specialQ++;e.preventDefault();}
  else if(e.code==='KeyP'||e.code==='Escape'){togglePause();e.preventDefault();}
});
addEventListener('keyup',e=>{const k=KMAP[e.code];if(k)keys[k]=0;if(e.code==='KeyF'||e.code==='KeyJ'||e.code==='KeyK')inkHold=0;});
addEventListener('blur',()=>{keys.left=keys.right=keys.down=0;inkHold=0;if(G&&!G.paused&&G.phase!=='end')togglePause();});
document.querySelectorAll('.pad button').forEach(b=>{

  const off=()=>{b.classList.remove('on');if(k==='ink')inkHold=0;else if(k!=='jump'&&k!=='special')keys[k]=0;};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

/* ---------- 게임 상태 ---------- */
let G=null,lastSea='east';
function start(k){
  lastSea=k;const S=SEAS[k];
  const rnd=srand(k.length*977+Math.floor(Math.random()*9999));
  const obs=[];let x=900;
  while(x<STAGE-250){
    const type=S.obs[Math.floor(rnd()*S.obs.length)];
    const prog=x/STAGE;
    const h=Math.round(34+rnd()*(55+prog*55)), w=Math.round(44+rnd()*50);
    const pts=[];const n=9;for(let i=0;i<=n;i++){pts.push([i/n,0.55+rnd()*0.45]);}
    obs.push({type,x,w,h,pts,seed:rnd()*1000});
    x+=360+rnd()*320;
  }
  const holes=[];for(let i=0;i<STAGE+W;i+=70+Math.random()*60)holes.push(i);
  G={S,k,t:0,camX:0,phase:'run',paused:false,
     p:{x:140,y:S.ground,vx:0,vy:0,on:true,jumps:0,lie:false,face:1,en:100,max:100,inv:0,ink:100,cd:0,jt:0,spg:0,sp:null},
     cr:[],inks:[],binks:[],trash:[],obs,holes,parts:[],floats:[],toasts:[],
     score:0,eaten:0,dex:{},spawnT:60,trashT:200,shake:0,blind:0,boss:null,endT:0,startTime:performance.now(),noteProt:false};
  S.sp.forEach(s=>G.dex[s.n]={seen:0,eat:0});
  for(const kk in keys)keys[kk]=0;jumpQ=inkQ=specialQ=0;
  $('#bPause').textContent='일시정지';
  show('game');
  if(document.body.classList.contains('touch')){const de=document.documentElement;if(de.requestFullscreen&&!document.fullscreenElement)de.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}
  try{$('#game').scrollIntoView({block:'start'});}catch(e){}
  toast(`${S.name} 바닷속으로 출발!`,S.meter,S.accent);
  toast('생물을 잡아먹으면 필살기 게이지가 차요','가득 차면 G 키(또는 필살기 버튼)로 여덟 다리 잡기!','#f0c870');
}

/* ---------- 유틸 ---------- */
function toast(text,sub,color){G.toasts.unshift({text,sub,color:color||'#e6f0f2',t:300});if(G.toasts.length>3)G.toasts.length=3;}
function floatText(x,y,text,color){G.floats.push({x,y,text,color,t:60});}
function over(a,b){return a.x1<b.x2&&a.x2>b.x1&&a.y1<b.y2&&a.y2>b.y1;}
function pBox(){const p=G.p;return{x1:p.x-32,x2:p.x+32,y1:p.y-78,y2:p.y-4};}
function cBox(c){return{x1:c.x-c.w*0.42,x2:c.x+c.w*0.42,y1:c.y-c.h*0.42,y2:c.y+c.h*0.42};}
function puff(x,y,n,col,sz){for(let i=0;i<n;i++)G.parts.push({x,y,vx:R(-1.2,1.2),vy:R(-1.2,0.6),r:R(sz*0.5,sz),g:R(0.15,0.4),life:R(40,70),max:70,col});}
function bubble(x,y){G.parts.push({x,y,vx:R(-0.3,0.3),vy:R(-1.4,-0.6),r:R(1.5,3.5),g:0,life:R(50,90),max:90,col:'bub'});}
function hurt(d,fromX,why){
  const p=G.p;if(p.inv>0||G.phase==='end')return;
  p.en-=d;p.inv=70;G.shake=10;floatText(p.x,p.y-96,'-'+d,'#ff8b7d');
  p.vx=(p.x<fromX?-1:1)*5;p.vy=Math.min(p.vy,-3.5);p.on=false;
  if(why)toast(why,null,'#ff9a8c');
  if(p.en<=0){p.en=0;endGame(false);}
}
function pick(list){let s=0;for(const x of list)s+=x.w8;let r=Math.random()*s;for(const x of list){r-=x.w8;if(r<=0)return x;}return list[0];}

/* ---------- 생물 출현 ---------- */
function spawn(){
  const S=G.S;const sp=pick(S.sp);
  const baseX=G.camX+W+60;
  const mk=(x,y,extra)=>Object.assign({sp,x,y,w:sp.w*CS,h:sp.h*CS,hp:sp.hp,mv:sp.mv,face:-1,ph:R(0,6.28),t:0,state:'alive',et:0,hitT:0,pv:1,vy:0,by:y},extra||{});
  const swimY=()=>sp.low?R(S.ground-70,S.ground-30):R(S.top+50,S.ground-60);
  const d=G.dex[sp.n];
  d.seen=1;
  if(sp.mv==='school'){const y=R(S.top+70,S.ground-90),n=6+Math.floor(Math.random()*4);for(let i=0;i<n;i++)G.cr.push(mk(baseX+R(0,90),y+R(-30,30),{ph:i*0.4}));return;}
  const groundY=S.ground-sp.h*CS/2;
  if(['crawl','ground','static','burrow','hop'].includes(sp.mv)){
    const c=mk(baseX,groundY);
    if(sp.mv==='burrow')c.pv=0;
    // 바위 위에 겹치지 않게
    for(const o of G.obs)if(Math.abs(o.x-c.x)<o.w/2+c.w)c.x+=o.w+c.w+20;
    G.cr.push(c);return;
  }
  if(sp.mv==='drift'){const y=R(S.top+80,S.ground-130);G.cr.push(mk(baseX,y,{by:y}));return;}
  G.cr.push(mk(baseX,swimY()));
}

/* ---------- 업데이트 ---------- */
function step(){
  const S=G.S,p=G.p;G.t++;
  if(G.phase==='end'){G.endT++;updateParts();if(G.endT===80)showEnd();return;}
  // --- 플레이어
  while(specialQ>0){specialQ--;trySpecial();}
  p.spg=Math.min(100,p.spg+0.02);
  if(p.sp)updateSpecial();
  else{
  const acc=p.lie?0.22:0.5,maxv=p.lie?1.8:4.2;
  if(keys.right&&!keys.left){p.vx+=acc;p.face=1;}
  else if(keys.left&&!keys.right){p.vx-=acc;p.face=-1;}
  else p.vx*=0.84;
  p.vx=clamp(p.vx,-maxv,maxv);
  while(jumpQ>0){jumpQ--;
    if(p.jumps<7){p.jumps++;const v=-6*Math.sqrt(p.jumps);if(p.vy>v)p.vy=v;p.on=false;p.lie=false;p.jt=40;for(let i=0;i<4;i++)bubble(p.x+R(-14,14),p.y-4);}
  }
  p.vy=Math.min(p.vy+0.32,5.5);
  p.y+=p.vy;
  if(p.y>=S.ground){if(!p.on&&p.vy>3)puff(p.x,S.ground,4,S.key==='west'?'#5a4530':'#c9b98a',6);p.y=S.ground;p.vy=0;p.on=true;p.jumps=0;}
  if(p.y-78<S.top){p.y=S.top+78;if(p.vy<0)p.vy=0;}
  p.lie=false;
  p.x+=p.vx;
  const minX=G.camX+28,maxX=G.phase==='boss'?STAGE+W-40:STAGE+W;
  p.x=clamp(p.x,minX,maxX);
  if(p.inv>0)p.inv--; if(p.cd>0)p.cd--; if(p.jt>0)p.jt--;
  p.ink=Math.min(100,p.ink+(G.phase==='boss'?0.34:0.28));
  if((inkQ>0||inkHold)&&p.cd<=0&&p.ink>=7){inkQ=0;p.cd=11;p.ink-=7;p.spray=7;} else inkQ=0;
  if(p.spray>0){
    p.spray--;
    const my=p.y-38,mx=p.x+p.face*30;
    for(let i=0;i<6;i++){
      const a=R(-0.2,0.2)*(Math.random()<0.4?0.35:1),v=R(7,13);
      G.inks.push({x:mx,y:my,vx:p.face*Math.cos(a)*v+p.vx*0.5,vy:Math.sin(a)*v,r:R(2,4),gr:R(0.2,0.45),life:R(34,52),max:52,spent:0});
    }
  }
  if(Math.abs(p.vx)>1&&G.t%9===0)bubble(p.x-p.face*18,p.y-30);
  }

  // --- 카메라 & 보스 진입
  if(G.phase==='run'){
    G.camX=clamp(p.x-Math.max(330,Math.round(W*0.4)),0,STAGE);
    if(G.camX>=STAGE)startBoss();
  }

  // --- 출현
  if(G.phase==='run'&&G.camX<STAGE-300){
    if(--G.spawnT<=0){spawn();G.spawnT=R(60,115)*(1-G.camX/STAGE*0.35);}
  }
  if(--G.trashT<=0){spawnTrash();G.trashT=G.phase==='boss'?R(200,320):R(110,210)*(1-G.camX/STAGE*0.3);}

  // --- 생물
  for(const c of G.cr){
    c.t++;if(c.hitT>0)c.hitT--;
    const sp=c.sp;
    if(c.held)continue;
    if(c.state==='eaten'){
      c.et++;const tx=p.x+p.face*20,ty=p.y-42;c.x+=(tx-c.x)*0.14;c.y+=(ty-c.y)*0.14;
      if(c.et>=36){c.dead=1;eat(c);}
      continue;
    }
    switch(c.mv){
      case 'swim':c.x-=sp.spd;c.y+=Math.sin(c.t*0.05+c.ph)*0.6;break;
      case 'school':c.x-=sp.spd;c.y+=Math.sin(c.t*0.08+c.ph)*0.8;break;
      case 'dart':{c.x-=sp.spd;const dx=c.x-p.x;if(dx>0&&dx<420){c.y+=clamp((p.y-44)-c.y,-1.3,1.3);}c.y=clamp(c.y,S.top+20,S.ground-c.h/2);break;}
      case 'crawl':{
        if(sp.aggr){const dir=Math.sign(p.x-c.x)||-1;c.face=dir;c.x+=dir*sp.spd*(0.6+0.4*Math.sin(c.t*0.1+c.ph));}
        else{c.x-=sp.spd*(0.5+0.5*Math.sin(c.t*0.05+c.ph));c.face=-1;}
        break;}
      case 'ground':c.x-=sp.spd;break;
      case 'burrow':c.pv=clamp((Math.sin(c.t*0.035+c.ph)+0.3)/1.3,0,1);break;
      case 'hop':{
        c.vy+=0.3;c.y+=c.vy;const gy=S.ground-c.h/2;
        if(c.y>=gy){c.y=gy;c.vy=0;if((c.t+Math.floor(c.ph*20))%80===0){c.vy=-5.5;}}
        else c.x-=1.2;break;}
      case 'drift':c.x-=sp.spd;c.y=c.by+Math.sin(c.t*0.02+c.ph)*40;break;
    }
    if(c.x<G.camX-220)c.dead=1;
    if(sp.aggr&&c.pv>0.4&&over(pBox(),cBox(c)))hurt(sp.atk,c.x,`${sp.n}에게 공격당했어요!`);
  }
  G.cr=G.cr.filter(c=>!c.dead);

  // --- 장애물 (바위·산호)
  const pb=pBox();
  for(const o of G.obs){
    if(o.x<G.camX-150||o.x>G.camX+W+150)continue;
    const ob={x1:o.x-o.w*0.42,x2:o.x+o.w*0.42,y1:S.ground-o.h*0.9,y2:S.ground};
    if(over(pb,ob))hurt(8,o.x,o.type==='coral'?'산호에 부딪혔어요!':o.type==='shells'?'굴 껍데기 더미에 긁혔어요!':'바위에 부딪혔어요!');
  }

  // --- 쓰레기
  for(const tr of G.trash){
    if(!tr.landed){tr.y+=tr.vy;tr.x+=Math.sin(G.t*0.03+tr.ph)*0.7;tr.rot+=tr.vr;if(tr.y>=S.ground-tr.h/2){tr.y=S.ground-tr.h/2;tr.landed=1;}}
    else{tr.life--;if(tr.life<=0)tr.dead=1;}
    if(tr.x<G.camX-100)tr.dead=1;
    if(!tr.dead&&tr.life>30&&over(pBox(),{x1:tr.x-tr.w/2,x2:tr.x+tr.w/2,y1:tr.y-tr.h/2,y2:tr.y+tr.h/2})){tr.dead=1;hurt(7,tr.x,`해양쓰레기(${tr.label})에 맞았어요!`);}
  }
  G.trash=G.trash.filter(t=>!t.dead);

  // --- 먹물 (스프레이)
  for(const k of G.inks){
    k.x+=k.vx;k.y+=k.vy;k.vx*=0.9;k.vy=k.vy*0.9-0.012;k.r+=k.gr;k.life--;
    const jet=!k.spent&&Math.abs(k.vx)>1.6;
    if(jet)for(const c of G.cr){
      if(c.state!=='alive'||k.spent)continue;
      if(c.mv==='burrow'&&c.pv<0.35)continue;
      const b=cBox(c);
      if(k.x>b.x1-k.r&&k.x<b.x2+k.r&&k.y>b.y1-k.r&&k.y<b.y2+k.r){
        if(c.sp.protect){if(!G.noteProt){G.noteProt=true;toast(`${c.sp.n}은(는) 보호종이라 먹물이 통하지 않아요`,null,'#a8e6bd');}continue;}
        k.spent=1;k.vx*=0.25;k.vy*=0.25;c.hp-=0.22;c.hitT=12;
        if(c.hp<=0){c.hp=0;c.state='eaten';floatText(c.x,c.y-20,c.sp.n,'#fff3c4');}
      }
    }
    const B=G.boss;
    if(B&&B.state==='fight'&&!k.spent&&Math.abs(k.vx)>1.6&&Math.abs(k.x-B.x)<90&&k.y>B.y-170&&k.y<B.y){
      k.spent=1;k.vx*=0.25;B.hp-=INK_BURST_BOSS/42;B.hitT=10;G.p.spg=Math.min(100,G.p.spg+0.45);
      if(B.hp<=0){B.hp=0;B.state='down';B.t=0;toast('거대 참문어를 물리쳤어요!','잡아먹으면 1단계 클리어!','#fff3c4');}
    }
    if(k.life<=0)G.parts.push({x:k.x,y:k.y,vx:R(-0.2,0.2),vy:R(-0.3,0),r:k.r,g:0.22,life:45,max:45,col:'ink'});
  }
  G.inks=G.inks.filter(k=>k.life>0&&k.x>G.camX-60&&k.x<G.camX+W+60);

  if(G.boss)updateBoss();
  updateParts();
  for(const f of G.floats){f.t--;f.y-=0.6;}G.floats=G.floats.filter(f=>f.t>0);
  for(const t of G.toasts)t.t--;G.toasts=G.toasts.filter(t=>t.t>0);
  if(G.shake>0)G.shake--; if(G.blind>0)G.blind--; if(G.flash>0)G.flash--;
}
function updateParts(){for(const q of G.parts){q.x+=q.vx;q.y+=q.vy;q.r+=q.g;q.life--;}G.parts=G.parts.filter(q=>q.life>0);if(G.parts.length>500)G.parts.splice(0,G.parts.length-500);}
function eat(c){
  const p=G.p,sp=c.sp;G.eaten++;G.dex[sp.n].eat++;
  p.spg=Math.min(100,p.spg+sp.food*2.2);
  const before=p.en;p.en=Math.min(p.max,p.en+sp.food);
  const extra=sp.food-(p.en-before);
  G.score+=sp.food*10+(sp.aggr?60:0)+extra*5;
  floatText(p.x,p.y-100,`+${sp.food} 에너지`,'#9ff0c0');
  for(let i=0;i<5;i++)bubble(p.x+R(-10,10),p.y-30);
}
const TRASH=[
  {type:'bottle',label:'페트병',w:14,h:30},{type:'bag',label:'비닐봉지',w:30,h:26},{type:'can',label:'캔',w:14,h:22},
  {type:'foam',label:'스티로폼 부표',w:36,h:22},{type:'net',label:'폐그물',w:44,h:30}];
function spawnTrash(){
  const tp=TRASH[Math.floor(Math.random()*TRASH.length)];
  const x=G.phase==='boss'?R(G.camX+80,G.camX+W-200):G.camX+R(200,W+180);
  G.trash.push(Object.assign({},tp,{x,y:(G.S.surface??-30)-10,vy:R(0.8,1.5),ph:R(0,6),rot:R(-0.5,0.5),vr:R(-0.02,0.02),landed:0,life:200}));
}

/* ---------- 보스: 거대 참문어 ---------- */
function startBoss(){
  G.phase='boss';G.camX=STAGE;
  G.cr=G.cr.filter(c=>c.x>STAGE+40&&c.x<STAGE+W);
  const hp=G.p.max*2;
  G.boss={x:STAGE+W+140,y:G.S.ground,vx:0,vy:0,hp,max:hp,t:0,state:'enter',pat:'idle',pt:0,hitT:0,home:STAGE+W-230,face:-1,on:true};
  toast('1단계 보스 · 거대 참문어 등장!',`더 크고, 더 많고 진한 먹물을 뿜어요. 에너지 ${hp} (내 에너지의 2배)`,'#ffb0a3');
}
function bossShoot(x,y,vx,vy,r){G.binks.push({x,y,vx,vy,r,life:220,w:R(0,6)});}
function updateBoss(){
  const B=G.boss,p=G.p,S=G.S;B.t++;if(B.hitT>0)B.hitT--;
  if(B.state==='enter'){B.x-=3;if(B.x<=B.home){B.x=B.home;B.state='fight';B.pt=60;}}
  else if(B.state==='fight'){
    const rage=B.hp<B.max/2;
    B.face=p.x<B.x?-1:1;
    // 중력
    B.vy+=0.35;B.y+=B.vy;B.x+=B.vx;
    if(B.y>=S.ground){B.y=S.ground;B.vy=0;B.vx*=0.8;B.on=true;}else B.on=false;
    if(B.y-170<S.top){B.y=S.top+170;B.vy=Math.max(0,B.vy);}
    B.x=clamp(B.x,STAGE+300,STAGE+W-90);
    const mx=B.x+B.face*59,my=B.y-91;
    B.pt--;
    if(B.pat==='idle'){
      if(B.on&&B.x!==B.home)B.x+=(B.home-B.x)*0.03;
      if(B.pt<=0){const pats=['fan','low','lunge','fan','rain','low'];B.pat=pats[Math.floor(Math.random()*pats.length)];B.pt=rage?100:130;B.k=0;}
    } else {
      const k=B.k++;
      if(B.pat==='fan'&&k%(rage?16:22)===0&&k<70){
        const n=rage?7:5,ang=Math.atan2((p.y-44)-my,p.x-mx);
        for(let i=0;i<n;i++){const a=ang+(i-(n-1)/2)*0.17;bossShoot(mx,my,Math.cos(a)*3.8,Math.sin(a)*3.8,R(15,22));}
        puff(mx,my,8,'bink',16);
      }
      if(B.pat==='low'&&k%(rage?20:26)===0&&k<90){bossShoot(mx,S.ground-14,B.face*5,0,15);puff(mx,S.ground-14,5,'bink',12);}
      if(B.pat==='high'&&k%(rage?20:26)===0&&k<90){bossShoot(mx,S.ground-44,B.face*5,0,14);puff(mx,S.ground-44,5,'bink',12);}
      if(B.pat==='lunge'&&k===10&&B.on){B.vy=-10;B.vx=B.face*5.5;}
      if(B.pat==='rain'&&k%(rage?8:11)===0&&k<70){bossShoot(R(STAGE+60,STAGE+W-160),S.top-10,R(-0.4,0.4),R(2.2,3.2),R(13,19));}
      if(B.pt<=0){B.pat='idle';B.pt=rage?45:75;}
    }
    if(over(pBox(),{x1:B.x-85,x2:B.x+85,y1:B.y-162,y2:B.y}))hurt(14,B.x,'거대 참문어에게 붙잡혔어요!');
  }
  else if(B.state==='down'){
    B.t++;const tx=p.x+p.face*20,ty=p.y;B.x+=(tx-B.x)*0.05;B.y+=(ty-B.y)*0.05;
    if(B.t>80){G.score+=3000;G.eaten++;p.en=Math.min(p.max,p.en+40);floatText(p.x,p.y-70,'+40 에너지','#9ff0c0');G.boss=null;G.binks=[];endGame(true);return;}
  }
  for(const k of G.binks){
    k.x+=k.vx;k.y+=k.vy;k.life--;
    if(G.t%4===0)G.parts.push({x:k.x,y:k.y,vx:0,vy:0,r:k.r*0.7,g:0.3,life:40,max:40,col:'bink'});
    if(k.y>S.ground-k.r){k.y=S.ground-k.r;k.vy=0;k.vx*=0.95;if(Math.abs(k.vx)<0.3)k.life=Math.min(k.life,30);}
    const b=pBox();
    if(k.x>b.x1-k.r*0.7&&k.x<b.x2+k.r*0.7&&k.y>b.y1-k.r*0.7&&k.y<b.y2+k.r*0.7&&G.p.inv<=0){k.life=0;G.blind=110;hurt(10,k.x,'진한 먹물을 뒤집어썼어요! 앞이 안 보여요');}
  }
  G.binks=G.binks.filter(k=>k.life>0&&k.x>STAGE-40&&k.x<STAGE+W+40);
}

function endGame(win){
  if(G.phase==='end')return;
  G.phase='end';G.win=win;G.endT=0;
  if(!win){G.shake=20;toast('문어의 에너지가 모두 떨어졌어요','다시 도전해 보세요','#ff9a8c');}
  else toast('1단계 클리어!','도감을 확인해 보세요','#fff3c4');
}
function showEnd(){
  const S=G.S,win=G.win;
  $('#endTitle').textContent=win?`${S.name} 1단계 클리어`:'게임 오버';
  $('#endMsg').textContent=win?'거대 참문어를 잡아먹었어요. 다른 바다에서도 도전해 보세요.':'바위·산호·쓰레기를 피하고, 공격형 생물은 먹물로 먼저 잡아 보세요. 뛰기를 여러 번 누르면 더 높이 뛰어요.';
  const sec=Math.round((performance.now()-G.startTime)/1000);
  const dist=Math.round(Math.min(G.p.x,STAGE+W)/10);
  const seen=Object.values(G.dex).filter(d=>d.seen).length;
  $('#endStats').innerHTML=[['점수',G.score.toLocaleString()],['나아간 거리',dist+' m'],['잡아먹은 생물',G.eaten+' 마리'],['만난 생물',`${seen} / ${S.sp.length} 종`],['플레이 시간',`${Math.floor(sec/60)}분 ${sec%60}초`]]
    .map(([a,b])=>`<div><b>${b}</b><span>${a}</span></div>`).join('');
  $('#dex').innerHTML=CAT_ORDER.flatMap(c=>S.sp.filter(s=>s.cat===c)).map(s=>{
    const d=G.dex[s.n];const st=s.protect?(d.seen?'만남 · 보호종':'못 만남'):d.eat?`먹음 ×${d.eat}`:d.seen?'만남':'못 만남';
    return `<div class="dexi${d.seen?'':' no'}"><h3>${s.n}<em>${s.cat}${s.aggr?' · 공격형':''} · ${st}</em></h3><p>${s.fact}</p></div>`;
  }).join('');
  show('end');
}

/* ---------- 그리기: 배경 ---------- */
function ridge(base,amp,par,f1,f2,col,step){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W+step;x+=step){const wx=x+G.camX*par;ctx.lineTo(x,base+Math.sin(wx*f1)*amp+Math.sin(wx*f2+1.7)*amp*0.45);}
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}
function skyBand(sf,c1,c2){
  const g=ctx.createLinearGradient(0,0,0,sf);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,sf);
  ctx.fillStyle='rgba(255,255,255,0.92)';
  for(let i=0;i<4;i++){const x=((i*310-G.camX*0.03+G.t*0.06)%1300+1300)%1300-150,y=sf*0.3+(i%2)*sf*0.22;ctx.beginPath();ctx.ellipse(x,y,30,Math.max(3,sf*0.1),0,0,7);ctx.ellipse(x+18,y-sf*0.06,18,Math.max(3,sf*0.1),0,0,7);ctx.fill();}
  ctx.fillStyle='rgba(255,250,215,0.95)';ctx.beginPath();ctx.arc(W-150,sf*0.42,Math.max(6,sf*0.24),0,7);ctx.fill();
}
function waterBody(sf,stops){const g=ctx.createLinearGradient(0,sf,0,H);stops.forEach(([o,c])=>g.addColorStop(o,c));ctx.fillStyle=g;ctx.fillRect(0,sf,W,H-sf);}
function sunRays(sf,a){ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){const x0=((i*210-G.camX*0.08)%1470+1470)%1470-240;ctx.fillStyle=`rgba(255,255,235,${a+a*0.45*Math.sin(G.t*0.012+i)})`;ctx.beginPath();ctx.moveTo(x0,sf);ctx.lineTo(x0+55,sf);ctx.lineTo(x0+260,H);ctx.lineTo(x0+120,H);ctx.closePath();ctx.fill();}
  const g=ctx.createRadialGradient(W-150,sf,0,W-150,sf,320);g.addColorStop(0,'rgba(255,255,230,0.3)');g.addColorStop(1,'rgba(255,255,230,0)');ctx.fillStyle=g;ctx.fillRect(0,sf,W,H-sf);
  ctx.restore();}
function surfaceLine(sf){
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=2;
  for(let r=0;r<3;r++){ctx.beginPath();for(let x=0;x<=W;x+=12)ctx.lineTo(x,sf+7+r*9+Math.sin((x+G.camX)*0.03+G.t*0.05+r*2)*3);ctx.stroke();}ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2.5;ctx.beginPath();for(let x=0;x<=W;x+=8)ctx.lineTo(x,sf+Math.sin((x+G.camX)*0.045+G.t*0.06)*2.2);ctx.stroke();
}
function caustics(gy,a){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(255,255,225,${a})`;ctx.lineWidth=2;
  for(let i=0;i<16;i++){const x=((i*80-G.camX)%1280+1280)%1280-60;ctx.beginPath();ctx.ellipse(x+Math.sin(G.t*0.02+i)*10,gy+16+(i%4)*12,24,4.5,Math.sin(i)*0.2,0,7);ctx.stroke();}ctx.restore();}
function drawBG(){
  const S=G.S,t=G.t,cx=G.camX,gy=S.ground,sf=S.surface;
  if(S.key==='east'){
    skyBand(sf,'#4aa8ea','#c4e8fa');
    waterBody(sf,[[0,'#43a6e6'],[0.3,'#2584d2'],[0.7,'#175fb0'],[1,'#114f98']]);
    sunRays(sf,0.06);
    ridge(300,70,0.12,0.004,0.011,'#1a64ae',16);
    ridge(372,45,0.35,0.006,0.017,'#1d6cb2',12);
    for(let i=Math.floor(cx*0.6/120)-1;i<Math.floor((cx*0.6+W)/120)+2;i++){
      const x=i*120-cx*0.6+((i*53)%40),hh=80+((i*37)%60);
      ctx.strokeStyle='#3f8a5c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,gy+6);
      for(let k=1;k<=6;k++)ctx.lineTo(x+Math.sin(t*0.02+i+k*0.6)*6*k/3,gy+6-hh*k/6);ctx.stroke();
      ctx.fillStyle='#4f9a66';for(let k=2;k<=6;k+=2){ctx.beginPath();ctx.ellipse(x+Math.sin(t*0.02+i+k*0.6)*6*k/3+6,gy+6-hh*k/6,8,3,0.5,0,7);ctx.fill();}
    }
    surfaceLine(sf);
    ctx.fillStyle='#6d7f8d';ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W+10;x+=10){const wx=x+cx;ctx.lineTo(x,gy-3+Math.sin(wx*0.05)*2+Math.sin(wx*0.13)*2);}ctx.lineTo(W,H);ctx.fill();
    for(let i=Math.floor(cx/55)-1;i<Math.floor((cx+W)/55)+2;i++){const x=i*55-cx+((i*29)%30);ctx.fillStyle=i%2?'#8496a4':'#5e7080';ctx.beginPath();ctx.ellipse(x,gy+10+((i*13)%20),12+((i*7)%14),6,0,0,7);ctx.fill();}
    caustics(gy,0.07);
  } else if(S.key==='west'){
    skyBand(sf,'#6cc2ef','#dcf2fb');
    ctx.fillStyle='#a49a76';ctx.fillRect(0,sf-12,W,12);
    for(let x=0;x<W;x+=6){const wx=x+cx*0.1,h=4+Math.abs(Math.sin(wx*0.07))*6;ctx.fillStyle=Math.sin(wx*0.013)>0?'#b8443a':'#8f8048';ctx.fillRect(x,sf-12-h,5,h);}
    waterBody(sf,[[0,'#8fd6cb'],[0.45,'#6fbca8'],[0.85,'#8aa774'],[1,'#8f9a66']]);
    sunRays(sf,0.05);
    surfaceLine(sf);
    ridge(gy-40,18,0.35,0.005,0.013,'#8a7452',12);
    ctx.fillStyle='#806143';ctx.fillRect(0,gy-2,W,H-gy+2);
    ctx.strokeStyle='rgba(255,245,220,0.28)';ctx.lineWidth=1.5;
    for(let i=0;i<6;i++){ctx.beginPath();for(let x=0;x<=W;x+=12)ctx.lineTo(x,gy+10+i*11+Math.sin((x+cx)*0.03+i)*2);ctx.stroke();}
    for(const hx of G.holes){const x=hx-cx;if(x<-20||x>W+20)continue;ctx.fillStyle='#3e2e1e';ctx.beginPath();ctx.ellipse(x,gy+3,7,3,0,0,7);ctx.fill();ctx.fillStyle='#a08364';for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(x+10+j*5,gy+1-(j%2)*2,2,0,7);ctx.fill();}}
    caustics(gy,0.06);
  } else {
    skyBand(sf,'#5fc2f0','#e6f7fb');
    ctx.save();ctx.beginPath();ctx.rect(0,0,W,sf);ctx.clip();
    for(let i=-1;i<4;i++){const x=i*420-(cx*0.08)%420+120;ctx.fillStyle='#5a9a72';ctx.beginPath();ctx.ellipse(x,sf,90+(i*31%40),22+(i*17%10),0,Math.PI,0);ctx.fill();}
    const bx=((600-cx*0.12)%2400+2400)%2400-400;ctx.strokeStyle='#7f9fa6';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx,sf-6);ctx.quadraticCurveTo(bx+120,sf-40,bx+240,sf-6);ctx.stroke();ctx.beginPath();ctx.moveTo(bx-40,sf-10);ctx.lineTo(bx+280,sf-10);ctx.stroke();
    ctx.restore();
    waterBody(sf,[[0,'#74e8dc'],[0.5,'#38c6c8'],[1,'#22a3b4']]);
    sunRays(sf,0.07);
    for(let i=Math.floor(cx*0.5/1500)-1;i<Math.floor((cx*0.5+W)/1500)+2;i++){
      const x=i*1500-cx*0.5+300;ctx.strokeStyle='rgba(70,90,70,0.4)';ctx.lineWidth=3;
      for(let j=0;j<12;j++){const px=x+j*14;ctx.beginPath();ctx.moveTo(px,sf-8);ctx.lineTo(px,gy-20-Math.abs(j-6)*4);ctx.stroke();}
    }
    for(let i=Math.floor(cx/70)-1;i<Math.floor((cx+W)/70)+2;i++){const x=i*70-cx,y=sf+Math.sin(t*0.05+i)*2;ctx.strokeStyle='rgba(255,255,245,0.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+90);ctx.stroke();ctx.fillStyle=i%3?'#f6f4ec':'#ee8a3a';ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();}
    surfaceLine(sf);
    ridge(gy-30,14,0.35,0.006,0.015,'#46b2ac',12);
    ctx.fillStyle='#efdfb0';ctx.fillRect(0,gy-2,W,H-gy+2);
    ctx.strokeStyle='rgba(190,160,105,0.5)';ctx.lineWidth=1.5;
    for(let i=0;i<5;i++){ctx.beginPath();for(let x=0;x<=W;x+=10)ctx.lineTo(x,gy+10+i*13+Math.sin((x+cx)*0.06+i*2)*3);ctx.stroke();}
    caustics(gy,0.16);
    for(let i=Math.floor(cx/90)-1;i<Math.floor((cx+W)/90)+2;i++){const x=i*90-cx+((i*41)%50);ctx.strokeStyle='#4aa65a';ctx.lineWidth=3;
      for(let j=0;j<4;j++){ctx.beginPath();ctx.moveTo(x+j*4,gy);ctx.quadraticCurveTo(x+j*4+Math.sin(t*0.03+i+j)*8,gy-25,x+j*4+Math.sin(t*0.03+i+j)*14,gy-44-(j%2)*10);ctx.stroke();}}
  }
}

/* 바위: 실제 바위처럼 면(facet)·균열·질감·부착생물·그림자를 표현 */
function rockGeo(o){
  const r=srand(Math.floor(o.seed*1000)+7),N=16,pts=[],lean=(r()-0.5)*0.3;
  for(let i=0;i<=N;i++){const a=Math.PI-(i/N)*Math.PI,k=0.82+r()*0.18,fl=Math.pow(Math.sin(a),0.6);
    pts.push([Math.cos(a)*o.w*0.5*(0.92+r()*0.1)+lean*o.w*fl*0.4,-Math.max(0.05,fl)*o.h*k]);}
  pts[0][1]=4;pts[N][1]=4;
  const facets=[];for(let i=0;i<7;i++){const a=1+Math.floor(r()*(N-3));facets.push({a,b:Math.min(N-1,a+2+Math.floor(r()*3)),cx:(r()-0.5)*o.w*0.5,cy:-o.h*(0.2+r()*0.45),light:r()<0.5});}
  const cracks=[];for(let i=0;i<2+Math.floor(r()*2);i++){let x=(r()-0.5)*o.w*0.6,y=-o.h*(0.45+r()*0.45);const c=[[x,y]];for(let k=0;k<4;k++){x+=(r()-0.5)*o.w*0.18;y+=o.h*(0.07+r()*0.11);c.push([x,y]);}cracks.push(c);}
  const dots=[];for(let i=0;i<90;i++)dots.push([(r()-0.5)*o.w,-r()*o.h,r()<0.5,0.5+r()*1.3]);
  const grow=[];for(let i=0;i<16;i++){const p=pts[1+Math.floor(r()*(N-1))];grow.push([p[0]*(0.55+r()*0.45),p[1]*(0.45+r()*0.55),2+r()*4,r()]);}
  const peb=[];for(let i=0;i<3+Math.floor(r()*3);i++){const sd=r()<0.5?-1:1;peb.push([sd*o.w*(0.45+r()*0.35),3+r()*5,3+r()*6]);}
  return{pts,facets,cracks,dots,grow,peb};
}
function smoothPath(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length-1;i++){ctx.quadraticCurveTo(pts[i][0],pts[i][1],(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2);}ctx.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]);ctx.closePath();}
const ROCKPAL={east:['#a6b6c4','#6c7e8f','#364452'],west:['#b0a182','#7d6f55','#463c2c'],south:['#cbd2c9','#909b91','#58625c']};
function drawRock(o,x,gy,key){
  const q=o.geo||(o.geo=rockGeo(o)),[L,M,D]=ROCKPAL[key],n=q.pts.length-1;
  ctx.save();ctx.translate(x,gy);
  let g=ctx.createRadialGradient(0,2,2,0,2,o.w*0.75);g.addColorStop(0,'rgba(0,0,0,0.35)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,3,o.w*0.78,9,0,0,7);ctx.fill();
  for(const [px,py,pr] of q.peb){const pg=ctx.createRadialGradient(px-pr*0.3,py-pr*0.6,0.5,px,py,pr*1.1);pg.addColorStop(0,L);pg.addColorStop(1,D);ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(px,py-pr*0.3,pr,pr*0.65,0,0,7);ctx.fill();}
  smoothPath(q.pts);
  g=ctx.createLinearGradient(-o.w*0.4,-o.h,o.w*0.35,0);g.addColorStop(0,L);g.addColorStop(0.5,M);g.addColorStop(1,D);
  ctx.fillStyle=g;ctx.fill();
  ctx.save();ctx.clip();
  for(const f of q.facets){ctx.beginPath();ctx.moveTo(q.pts[f.a][0],q.pts[f.a][1]);for(let i=f.a+1;i<=f.b;i++)ctx.lineTo(q.pts[i][0],q.pts[i][1]);ctx.lineTo(f.cx,f.cy);ctx.closePath();ctx.fillStyle=f.light?'rgba(255,255,255,0.11)':'rgba(0,0,0,0.14)';ctx.fill();}
  for(const [dx,dy,lt,r] of q.dots){ctx.fillStyle=lt?'rgba(255,255,255,0.22)':'rgba(0,0,0,0.26)';ctx.fillRect(dx,dy,r,r);}
  for(const [gx,gy2,gr,t] of q.grow){
    if(key==='east'){ctx.fillStyle=t<0.6?'rgba(206,128,160,0.75)':'rgba(242,192,208,0.6)';ctx.beginPath();ctx.ellipse(gx,gy2,gr*1.4,gr*0.8,t*3,0,7);ctx.fill();}
    else if(key==='west'){if(gy2<-o.h*0.6)continue;ctx.fillStyle='#e8e1cf';ctx.beginPath();ctx.arc(gx,gy2,gr*0.62,0,7);ctx.fill();ctx.fillStyle='#5a5040';ctx.beginPath();ctx.arc(gx,gy2,gr*0.24,0,7);ctx.fill();}
    else{ctx.fillStyle=t<0.65?'rgba(78,150,70,0.72)':'rgba(232,228,212,0.9)';ctx.beginPath();ctx.arc(gx,gy2,t<0.65?gr:gr*0.5,0,7);ctx.fill();}
  }
  if(key==='west'){const mg=ctx.createLinearGradient(0,-o.h*0.32,0,0);mg.addColorStop(0,'rgba(95,68,42,0)');mg.addColorStop(1,'rgba(95,68,42,0.75)');ctx.fillStyle=mg;ctx.fillRect(-o.w,-o.h*0.32,o.w*2,o.h*0.32+6);}
  ctx.lineCap='round';
  for(const c of q.cracks){ctx.strokeStyle='rgba(18,18,24,0.5)';ctx.lineWidth=1.3;ctx.beginPath();c.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=0.8;ctx.beginPath();c.forEach((p,i)=>i?ctx.lineTo(p[0]+1,p[1]+1):ctx.moveTo(p[0]+1,p[1]+1));ctx.stroke();}
  g=ctx.createLinearGradient(0,-o.h*0.38,0,4);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.4)');ctx.fillStyle=g;ctx.fillRect(-o.w,-o.h*0.38,o.w*2,o.h*0.38+6);
  g=ctx.createLinearGradient(0,-o.h,0,-o.h*0.5);g.addColorStop(0,'rgba(255,255,240,0.3)');g.addColorStop(1,'rgba(255,255,240,0)');ctx.fillStyle=g;ctx.fillRect(-o.w,-o.h*1.1,o.w*2,o.h*0.6);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,245,0.4)';ctx.lineWidth=1.4;ctx.beginPath();
  for(let i=Math.floor(n*0.22);i<=Math.floor(n*0.72);i++){const p=q.pts[i];if(i===Math.floor(n*0.22))ctx.moveTo(p[0],p[1]+2);else ctx.lineTo(p[0],p[1]+2);}ctx.stroke();
  if(key==='east'){const p=q.pts[Math.floor(n*0.45)];ctx.strokeStyle='#5a8a4a';ctx.lineWidth=2;for(let k=0;k<3;k++){const sw=Math.sin(G.t*0.03+k+o.seed);ctx.beginPath();ctx.moveTo(p[0]+k*3,p[1]+3);ctx.quadraticCurveTo(p[0]+k*3+sw*5,p[1]-10,p[0]+k*3+sw*8,p[1]-18-k*3);ctx.stroke();}}
  smoothPath(q.pts);ctx.strokeStyle='rgba(18,24,30,0.35)';ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
}
function drawObstacle(o){
  const S=G.S,x=o.x-G.camX,gy=S.ground;
  if(o.type==='coral'){
    const cols=['#f07b6e','#f2a35c','#e7609a'];const col=cols[Math.floor(o.seed)%3];
    ctx.strokeStyle=col;ctx.lineCap='round';
    const br=(x0,y0,a,len,w,d)=>{if(d>4||len<6)return;const x1=x0+Math.cos(a)*len,y1=y0+Math.sin(a)*len;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
      br(x1,y1,a-0.45,len*0.72,w*0.72,d+1);br(x1,y1,a+0.4,len*0.68,w*0.72,d+1);};
    br(x,gy+2,-Math.PI/2,o.h*0.38,o.w*0.2,0);
    ctx.fillStyle=col;for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(x+Math.sin(o.seed+i)*o.w*0.35,gy-o.h*(0.55+0.4*Math.abs(Math.cos(o.seed*2+i))),4,0,Math.PI*2);ctx.fill();}
    return;
  }
  if(o.type==='shells'){
    ctx.fillStyle='#5b5246';ctx.beginPath();ctx.ellipse(x,gy,o.w/2,o.h*0.9,0,Math.PI,0);ctx.fill();
    for(let i=0;i<14;i++){const a=(i/14)*Math.PI,rr=0.75*((i*7)%10)/10+0.15;ctx.fillStyle=i%2?'#cfc6b4':'#9a9080';ctx.beginPath();ctx.ellipse(x-Math.cos(a)*o.w*0.4*rr,gy-Math.sin(a)*o.h*0.8*rr,9,5,a,0,Math.PI*2);ctx.fill();}
    return;
  }
  drawRock(o,x,gy,S.key);
}

/* ---------- 그리기: 생물 (실물 사진을 참고한 캐릭터체) ---------- */
function eye(x,y,r,iris){ctx.fillStyle=iris||'#e2c46a';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.fillStyle='#0a0a0c';ctx.beginPath();ctx.arc(x,y,r*0.62,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.95)';ctx.beginPath();ctx.arc(x-r*0.28,y-r*0.3,r*0.27,0,7);ctx.fill();}
const LOOK={
 '명태':{back:'#6f6e5c',belly:'#ece9de',fin:'#8a8574',tail:'truncate',dorsal:'three',anal:'two',pattern:'mottle',pat:'#4f4d3e',barbel:1},
 '도루묵':{back:'#978a66',belly:'#f4f1e8',fin:'#d6cdb4',tail:'truncate',dorsal:'two',anal:'long',pattern:'mottle',pat:'#6a5e44',eye:1.3},
 '청어':{back:'#2a6996',belly:'#f2f6f8',fin:'#c4d2da',tail:'fork',dorsal:'one',anal:'small',band:'rgba(200,225,240,0.7)'},
 '임연수어':{back:'#86763a',belly:'#f3ecce',fin:'#ccb865',tail:'fork',dorsal:'long',anal:'long',pattern:'bars',pat:'#3a341c'},
 '대구':{back:'#86755a',belly:'#f1ece0',fin:'#9b8a6a',tail:'truncate',dorsal:'three',anal:'two',pattern:'spots',pat:'#55452e',barbel:1,head:1.25,lat:'rgba(250,245,230,0.9)'},
 '방어':{back:'#2b5b7c',belly:'#f1f5f7',fin:'#cdc66c',tail:'deepfork',dorsal:'two',anal:'one',stripe:'#eac83a'},
 '참조기':{back:'#a99b68',belly:'#f6d34a',fin:'#ebc23e',tail:'truncate',dorsal:'two',anal:'small',mouth:'#d2503a'},
 '풀망둑':{back:'#857b5e',belly:'#ddd6c0',fin:'#9a9070',tail:'round',dorsal:'two',anal:'long',pattern:'mottle',pat:'#4a422e',eye:1.15,eyeTop:1,head:1.15},
 '멸치':{back:'#2b7894',belly:'#f4f9fb',fin:'#d6e6ee',tail:'fork',dorsal:'one',anal:'small',band:'rgba(225,240,248,0.95)',eye:1.45},
 '전갱이':{back:'#4a7c88',belly:'#f0f4f0',fin:'#dccc7c',tail:'deepfork',dorsal:'two',anal:'one',scutes:1,eye:1.2},
 '볼락':{back:'#664b34',belly:'#bba27c',fin:'#7a5a3a',tail:'truncate',dorsal:'spiny',anal:'one',pattern:'bars',pat:'#33241a',eye:1.65},
 '고등어':{back:'#23696a',belly:'#f2f6f6',fin:'#8ea4a4',tail:'deepfork',dorsal:'two',anal:'small',pattern:'wavy',pat:'#0e3434',finlets:1},
 '눈볼대':{back:'#d9443a',belly:'#f8b8a8',fin:'#ec6e5e',tail:'truncate',dorsal:'spiny',anal:'one',eye:2.0,mouth:'#1a1010',iris:'#e8e0e0'},
 '쥐치':{back:'#a6915f',belly:'#e8dec6',fin:'#cbb685',tail:'round',dorsal:'filefish',anal:'long',pattern:'mottle',pat:'#6a5a36'}
};
const DORS={one:[[-0.12,0.14,0.42]],two:[[-0.2,-0.02,0.42],[0.04,0.22,0.3]],three:[[-0.24,-0.1,0.36],[-0.06,0.08,0.32],[0.11,0.24,0.26]],long:[[-0.28,0.24,0.24]],spiny:[[-0.26,0.0,0.48,1],[0.02,0.2,0.34]],filefish:[[-0.28,-0.23,0.75,1],[0.0,0.22,0.28]]};
const ANAL={small:[[0.08,0.2,0.24]],one:[[0.0,0.2,0.28]],two:[[-0.05,0.08,0.26],[0.11,0.23,0.24]],long:[[-0.12,0.24,0.22]]};
function bTop(x,w,h){const u=clamp((x+w*0.5)/(w*0.8),0.02,1);return -h*0.5*Math.sin(Math.PI*u*0.92);}
function finAt(f,dir,col,w,h,t,ph){
  const X1=f[0]*w,X2=f[1]*w,spiny=f[3];
  const yb=x=>dir<0?bTop(x,w,h)*0.88:-bTop(x,w,h)*0.82;
  const H=f[2]*h*(1+Math.sin(t*0.1+ph)*0.06);
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(X1,yb(X1));
  if(spiny){const n=6;for(let i=0;i<n;i++){const x=X1+(X2-X1)*i/n;ctx.lineTo(x+1,yb(x)+dir*H*(1-i/n*0.4));ctx.lineTo(x+(X2-X1)/n,yb(x)+dir*H*(0.5-i/n*0.2));}}
  else{ctx.quadraticCurveTo(X1+(X2-X1)*0.12,yb(X1)+dir*H*1.05,X1+(X2-X1)*0.45,yb(X1)+dir*H);ctx.quadraticCurveTo(X2,yb(X2)+dir*H*0.55,X2,yb(X2));}
  ctx.lineTo(X2,yb(X2));ctx.closePath();ctx.globalAlpha*=0.88;ctx.fill();ctx.globalAlpha/=0.88;
  ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=0.8;
  for(let i=1;i<5;i++){const x=X1+(X2-X1)*i/5;ctx.beginPath();ctx.moveTo(x,yb(x));ctx.lineTo(x+(X2-X1)*0.04,yb(x)+dir*H*0.85*(1-i/7));ctx.stroke();}
}
function bodyPath(w,h,hb){
  const x0=-w*0.5,xp=w*0.3;hb=hb||1;
  ctx.beginPath();ctx.moveTo(x0,h*0.04);
  ctx.bezierCurveTo(x0+w*0.02,-h*0.34*hb,-w*0.3,-h*0.52,-w*0.1,-h*0.5);
  ctx.bezierCurveTo(w*0.1,-h*0.47,w*0.2,-h*0.2,xp,-h*0.11);
  ctx.lineTo(xp,h*0.11);
  ctx.bezierCurveTo(w*0.2,h*0.2,w*0.08,h*0.48,-w*0.12,h*0.48);
  ctx.bezierCurveTo(-w*0.32,h*0.48,x0+w*0.03,h*0.32,x0,h*0.04);
  ctx.closePath();
}
function tailPath(type,w,h,wag){
  const xp=w*0.3;ctx.beginPath();ctx.moveTo(xp-3,-h*0.1);
  if(type==='round'){ctx.quadraticCurveTo(w*0.52,-h*0.55+wag,w*0.54,wag);ctx.quadraticCurveTo(w*0.52,h*0.55+wag,xp-3,h*0.1);}
  else if(type==='truncate'){ctx.lineTo(w*0.5,-h*0.44+wag);ctx.quadraticCurveTo(w*0.47,wag,w*0.5,h*0.44+wag);ctx.lineTo(xp-3,h*0.1);}
  else{const d=type==='deepfork';ctx.quadraticCurveTo(xp+w*0.08,-h*0.25+wag*0.5,w*(d?0.57:0.52),-h*(d?0.64:0.5)+wag);
    ctx.quadraticCurveTo(xp+w*0.12,-h*0.1+wag,xp+w*(d?0.09:0.12),wag*0.6);
    ctx.quadraticCurveTo(xp+w*0.12,h*0.1+wag,w*(d?0.57:0.52),h*(d?0.64:0.5)+wag);
    ctx.quadraticCurveTo(xp+w*0.08,h*0.25+wag*0.5,xp-3,h*0.1);}
  ctx.closePath();
}
function drawFishR(s,w,h,t,ph){
  const L=LOOK[s.n]||{back:s.c2,belly:s.c1,fin:s.c2,tail:'fork',dorsal:'one',anal:'small'};
  const wag=Math.sin(t*0.25+ph)*h*0.16;
  tailPath(L.tail,w,h,wag);ctx.fillStyle=L.fin;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=0.8;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(w*0.3,i*h*0.04);ctx.lineTo(w*0.5,i*h*0.18+wag);ctx.stroke();}
  for(const f of DORS[L.dorsal])finAt(f,-1,L.fin,w,h,t,ph);
  for(const f of ANAL[L.anal])finAt(f,1,L.fin,w,h,t,ph);

function drawCreature(c){

/* ---------- 그리기: 전체 ---------- */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!G){ctx.fillStyle='#061219';ctx.fillRect(0,0,W,H);return;}
  const S=G.S,p=G.p;
  ctx.save();
  if(G.shake>0)ctx.translate(R(-G.shake,G.shake)*0.4,R(-G.shake,G.shake)*0.4);
  drawBG();
  for(const o of G.obs)if(o.x>G.camX-120&&o.x<G.camX+W+120)drawObstacle(o);
  if(G.phase==='boss'||G.boss){const x=STAGE+W-30-G.camX;ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(x,S.top-10,4,S.ground-S.top);}
  for(const c of G.cr)if(c.mv==='burrow'||c.mv==='static'||c.mv==='ground')drawCreature(c);
  for(const c of G.cr)if(!(c.mv==='burrow'||c.mv==='static'||c.mv==='ground'))drawCreature(c);
  for(const tr of G.trash)drawTrash(tr);
  // 보스
  const B=G.boss;
  if(B){
    ctx.save();ctx.translate(B.x-G.camX,B.y);
    const sc=B.state==='down'?Math.max(0.1,BS*(1-B.t/80)):BS;
    ctx.scale(sc*B.face,sc);if(B.hitT>0&&(B.hitT>>1)%2)ctx.globalAlpha=0.6;
    drawOcto('#86283a','#3e0d1a',G.t,false,{angry:1,spd:0.8,suck:1});
    ctx.restore();
  }
  // 플레이어 (필살기 다리 먼저)
  if(p.sp&&(p.sp.ph==='reach'||p.sp.ph==='pull'))drawGrabArms(p);
  ctx.save();ctx.translate(p.x-G.camX,p.y);ctx.scale(p.face*PS,PS);
  if(p.inv>0&&(p.inv>>2)%2)ctx.globalAlpha=0.45;
  drawOcto('#e6683e','#a63c22',G.t,p.lie,{spd:Math.abs(p.vx)>0.5?1.6:0.6,suck:1});
  ctx.restore();
  if(p.jt>0&&p.jumps>1){ctx.font='700 15px "IBM Plex Sans KR",sans-serif';ctx.textAlign='center';ctx.fillStyle=`rgba(255,240,200,${p.jt/40})`;ctx.fillText(`뛰기 ×${p.jumps}`,p.x-G.camX,p.y-104);}
  // 먹물
  ctx.lineCap='round';
  for(const k of G.inks){const x=k.x-G.camX,a=Math.min(1,k.life/k.max*1.6);
    ctx.fillStyle=`rgba(24,12,36,${0.32*a})`;ctx.beginPath();ctx.arc(x,k.y,k.r*1.5,0,7);ctx.fill();
    ctx.strokeStyle=`rgba(14,6,24,${0.8*a})`;ctx.lineWidth=Math.max(1.5,k.r*(k.spent?1.2:0.9));ctx.beginPath();ctx.moveTo(x-k.vx*2,k.y-k.vy*2);ctx.lineTo(x,k.y);ctx.stroke();}
  for(const k of G.binks){const x=k.x-G.camX,r=k.r*(1+Math.sin(G.t*0.2+k.w)*0.08);const g=ctx.createRadialGradient(x,k.y,0,x,k.y,r);g.addColorStop(0,'rgba(4,0,8,1)');g.addColorStop(0.7,'rgba(10,2,16,0.9)');g.addColorStop(1,'rgba(10,2,16,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,k.y,r,0,Math.PI*2);ctx.fill();}
  for(const q of G.parts){
    const x=q.x-G.camX,a=q.life/q.max;
    if(q.col==='bub'){ctx.strokeStyle=`rgba(230,250,255,${a*0.7})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,q.y,q.r,0,Math.PI*2);ctx.stroke();}
    else{ctx.fillStyle=q.col==='ink'?`rgba(22,12,34,${a*0.55})`:q.col==='bink'?`rgba(6,0,10,${a*0.7})`:q.col;if(q.col.startsWith('#'))ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,q.y,q.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  }
  // 해역 분위기
  if(S.key==='east'){
    ctx.fillStyle='rgba(255,255,255,0.35)';for(let i=0;i<40;i++){const x=((i*157-G.camX*0.9+G.t*0.2)%W+W)%W,y=S.surface+((i*97+G.t*(0.2+(i%5)*0.05))%(H-S.surface));ctx.fillRect(x,y,1.4,1.4);}
  } else if(S.key==='west'){
    for(let i=0;i<4;i++){const x=((i*330-G.camX*0.7+G.t*0.15)%1400+1400)%1400-170,y=S.ground-60-(i*47)%120;const g=ctx.createRadialGradient(x,y,0,x,y,160);g.addColorStop(0,'rgba(150,140,90,0.14)');g.addColorStop(1,'rgba(150,140,90,0)');ctx.fillStyle=g;ctx.fillRect(x-160,y-160,320,320);}
  }
  for(const f of G.floats){ctx.font='700 14px "IBM Plex Sans KR",sans-serif';ctx.textAlign='center';ctx.globalAlpha=Math.min(1,f.t/20);ctx.fillStyle='#000';ctx.fillText(f.text,f.x-G.camX+1,f.y+1);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x-G.camX,f.y);ctx.globalAlpha=1;}
  // 보스 먹물에 가려짐
  if(G.blind>0){const a=Math.min(1,G.blind/40);ctx.fillStyle=`rgba(5,0,10,${0.55*a})`;ctx.fillRect(0,0,W,H);
    for(let i=0;i<7;i++){const x=(i*173+50)%W,y=(i*91+40)%H,r=70+(i*37)%60;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(3,0,6,${0.85*a})`);g.addColorStop(1,'rgba(3,0,6,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}}
  if(G.flash>0){ctx.fillStyle=`rgba(255,226,150,${G.flash/40})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();
  drawHUD();
  const ready=p.spg>=100&&!p.sp;if(ready!==G.spReady){G.spReady=ready;const b=$('#bSp');if(b)b.classList.toggle('ready',ready);}
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawHUD(){ctx.save();ctx.scale(HUDS,HUDS);drawHUDi(W/HUDS,H/HUDS);ctx.restore();}
function drawHUDi(W,H){
  const S=G.S,p=G.p;
  ctx.fillStyle='rgba(3,12,18,0.62)';rr(12,12,262,86,8);ctx.fill();
  ctx.font='600 12px "IBM Plex Sans KR",sans-serif';ctx.textAlign='left';ctx.fillStyle='#cfe3ea';
  ctx.fillText('문어 에너지',22,30);ctx.fillText('먹물',22,58);
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(96,21,140,11);ctx.fillRect(96,50,140,8);
  const ep=p.en/p.max;ctx.fillStyle=ep>0.5?'#ee6a40':ep>0.25?'#f0a23a':'#ef4b4b';ctx.fillRect(96,21,140*ep,11);
  ctx.fillStyle='#a593d6';ctx.fillRect(96,50,140*p.ink/100,8);
  ctx.textAlign='right';ctx.fillStyle='#e6f0f2';ctx.fillText(Math.ceil(p.en),266,31);ctx.fillText(Math.floor(p.ink),266,58);
  ctx.textAlign='left';ctx.fillStyle='#f3d38a';ctx.fillText('필살기',22,82);
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(96,74,140,9);
  const full=p.spg>=100;ctx.fillStyle=full?`hsl(42,90%,${55+Math.sin(G.t*0.2)*12}%)`:'#c99a3a';ctx.fillRect(96,74,140*p.spg/100,9);
  ctx.textAlign='right';ctx.fillStyle=full?'#ffe08a':'#e6f0f2';ctx.fillText(full?'G!':Math.floor(p.spg)+'%',266,83);
  // 오른쪽
  ctx.fillStyle='rgba(3,12,18,0.62)';rr(W-262,12,250,62,8);ctx.fill();
  ctx.textAlign='right';ctx.font='400 22px "Black Han Sans",sans-serif';ctx.fillStyle=S.accent;ctx.fillText(S.name,W-22,38);
  ctx.font='600 11.5px "IBM Plex Sans KR",sans-serif';ctx.fillStyle='#9fbcc6';ctx.fillText(S.meter,W-22,60);
  ctx.textAlign='left';ctx.font='700 15px "IBM Plex Sans KR",sans-serif';ctx.fillStyle='#fff3c4';ctx.fillText(G.score.toLocaleString()+'점',W-250,38);
  // 진행도 / 보스 에너지
  const cx=W/2;
  if(G.boss&&G.boss.state!=='enter'||G.phase==='boss'&&G.boss){
    const B=G.boss;ctx.fillStyle='rgba(3,12,18,0.62)';rr(cx-170,14,340,40,8);ctx.fill();
    ctx.textAlign='center';ctx.font='600 12px "IBM Plex Sans KR",sans-serif';ctx.fillStyle='#ffb0a3';ctx.fillText(`보스 · 거대 참문어  ${Math.ceil(B.hp)} / ${B.max}`,cx,30);
    ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(cx-155,38,310,8);ctx.fillStyle='#b8344a';ctx.fillRect(cx-155,38,310*B.hp/B.max,8);
  } else if(G.phase==='run'){
    const pr=clamp(G.camX/STAGE,0,1);
    ctx.fillStyle='rgba(3,12,18,0.5)';rr(cx-130,16,260,30,8);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(cx-110,30,220,3);ctx.fillStyle=S.accent;ctx.fillRect(cx-110,30,220*pr,3);
    ctx.fillStyle='#ee6a40';ctx.beginPath();ctx.arc(cx-110+220*pr,31,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#86283a';ctx.beginPath();ctx.arc(cx+114,31,6,0,Math.PI*2);ctx.fill();
    ctx.textAlign='center';ctx.font='600 10.5px "IBM Plex Sans KR",sans-serif';ctx.fillStyle='#cfe3ea';ctx.fillText(`보스까지 ${Math.max(0,Math.round((STAGE-G.camX)/10))}m`,cx,26);
  }
  // 알림
  let y=H-18;
  for(const t of G.toasts){
    const a=Math.min(1,t.t/30);ctx.globalAlpha=a;
    ctx.font='700 13px "IBM Plex Sans KR",sans-serif';const w1=ctx.measureText(t.text).width;
    ctx.font='400 12px "IBM Plex Sans KR",sans-serif';const w2=t.sub?ctx.measureText(t.sub).width:0;
    const bw=Math.min(W-28,Math.max(w1,w2)+22),bh=t.sub?42:26;
    y-=bh;ctx.fillStyle='rgba(3,12,18,0.72)';rr(14,y,bw,bh,7);ctx.fill();
    ctx.fillStyle=t.color;ctx.fillRect(14,y+6,3,bh-12);
    ctx.textAlign='left';ctx.font='700 13px "IBM Plex Sans KR",sans-serif';ctx.fillStyle=t.color;ctx.fillText(t.text,25,y+17);
    if(t.sub){ctx.font='400 12px "IBM Plex Sans KR",sans-serif';ctx.fillStyle='#b9cfd7';ctx.fillText(t.sub,25,y+34);}
    y-=6;ctx.globalAlpha=1;
  }
  if(G.paused){ctx.fillStyle='rgba(2,8,12,0.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#e6f0f2';ctx.font='400 40px "Black Han Sans",sans-serif';ctx.fillText('일시정지',W/2,H/2);ctx.font='600 14px "IBM Plex Sans KR",sans-serif';ctx.fillText('P 키 또는 [계속하기]를 누르세요',W/2,H/2+30);}
}

/* ---------- 필살기: 뛰어올라 여덟 다리로 잡아먹기 ---------- */
const INK_BURST_BOSS=21;                 // 먹물 한 번(스프레이 42방울 × 0.5)이 보스에게 줄 수 있는 최대 피해
const SPECIAL_BOSS_DMG=INK_BURST_BOSS*2; // 필살기는 먹물 공격의 두 배
function spTargetPos(T){if(T.boss)return[T.boss.x,T.boss.y-26*BS];return[T.c.x,T.c.y];}
function trySpecial(){
  const p=G.p;if(p.sp||G.phase==='end')return;
  if(p.spg<100){toast('필살기 게이지가 아직 덜 찼어요','생물을 잡아먹으면 게이지가 차요','#f0c870');return;}
  let tgt=null;const B=G.boss;
  if(B&&B.state==='fight')tgt={boss:B};
  else{let best=1e9;
    for(const c of G.cr){
      if(c.state!=='alive'||c.sp.protect||(c.mv==='burrow'&&c.pv<0.35))continue;
      const dx=c.x-p.x,sx=c.x-G.camX;if(Math.abs(dx)>600||sx<0||sx>W)continue;
      const d=Math.hypot(dx,c.y-p.y)*(Math.sign(dx)===p.face?0.8:1.2);if(d<best){best=d;tgt={c};}
    }}
  if(!tgt){toast('필살기로 잡을 생물이 근처에 없어요',null,'#f0c870');return;}
  p.spg=0;p.sp={ph:'leap',t:0,tgt,e:0};p.vy=-11.5;p.vx=0;p.on=false;p.inv=Math.max(p.inv,300);G.flash=14;G.shake=6;
  if(tgt.c)tgt.c.held=1;
  floatText(p.x,p.y-120,'필살기! 여덟 다리 잡기','#ffd36a');
  for(let i=0;i<10;i++)bubble(p.x+R(-20,20),p.y-10);
}
function endSpecial(){const p=G.p;if(p.sp&&p.sp.tgt.c)p.sp.tgt.c.held=0;p.sp=null;p.inv=Math.min(p.inv,40);}
function updateSpecial(){
  const p=G.p,S=G.S,s=p.sp,T=s.tgt;s.t++;
  if(T.c&&(T.c.dead||T.c.state!=='alive')&&s.ph!=='pull'){endSpecial();return;}
  if(T.boss&&T.boss.state==='enter'){endSpecial();return;}
  const [tx]=spTargetPos(T);p.face=Math.sign(tx-p.x)||p.face;
  if(s.ph==='leap'){p.vy+=0.45;p.y+=p.vy;if(p.y-78<S.top){p.y=S.top+78;p.vy=0;}if(p.vy>=0){s.ph='reach';s.t=0;p.vy=0;}}
  else if(s.ph==='reach'){s.e=Math.min(1,s.t/15);if(s.e>=1){s.ph='pull';s.t=0;grabHit();}}
  else if(s.ph==='pull'){
    if(T.c){const c=T.c,mx=p.x+p.face*24,my=p.y-44;c.x+=(mx-c.x)*0.22;c.y+=(my-c.y)*0.22;
      if(s.t>=18){c.held=0;c.state='eaten';c.et=30;G.score+=100;endSpecial();}}
    else{s.e=Math.max(0,1-s.t/18);if(s.t>=18)endSpecial();}
  }
}
function grabHit(){
  const p=G.p,T=p.sp.tgt;G.shake=14;G.flash=8;
  if(T.boss){const B=T.boss;B.hp-=SPECIAL_BOSS_DMG;B.hitT=30;B.vx=-B.face*3;
    const [bx,by]=spTargetPos(T);puff(bx,by,14,'ink',14);floatText(B.x,by-70,`-${SPECIAL_BOSS_DMG} 필살기!`,'#ffd36a');
    if(B.hp<=0){B.hp=0;B.state='down';B.t=0;G.binks=[];toast('거대 참문어를 물리쳤어요!','잡아먹으면 1단계 클리어!','#fff3c4');}}
  else{T.c.hitT=14;floatText(T.c.x,T.c.y-30,'잡았다!','#ffd36a');}
}
function drawGrabArms(p){
  const s=p.sp,T=s.tgt,[tx,ty]=spTargetPos(T),e=s.e;if(e<=0)return;
  const ox=p.x-G.camX,oy=p.y-18*PS,TX=tx-G.camX,rad=T.boss?44:Math.max(10,T.c.w*0.32);
  ctx.lineCap='round';
  for(const pass of [0,1])for(let i=0;i<8;i++){
    if((i%2===0)!==(pass===0))continue;
    const a=i/8*Math.PI*2+G.t*0.04,sx=ox+(i-3.5)*4*PS,sy=oy+Math.abs(i-3.5)*2;
    const ex=TX+Math.cos(a)*rad,ey=ty+Math.sin(a)*rad*0.7,cx=sx+(ex-sx)*e,cy=sy+(ey-sy)*e;
    const mx=(sx+cx)/2+Math.sin(G.t*0.25+i)*10,my=(sy+cy)/2-34*e+Math.cos(G.t*0.3+i)*8;
    ctx.strokeStyle=pass?'#e6683e':'#a63c22';let px=sx,py=sy;
    for(let k=1;k<=18;k++){const u=k/18,x=(1-u)*(1-u)*sx+2*(1-u)*u*mx+u*u*cx,y=(1-u)*(1-u)*sy+2*(1-u)*u*my+u*u*cy;
      ctx.lineWidth=(9*(1-u)+2.6)*PS*0.75;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();
      if(pass&&k%2===0&&k<18){ctx.fillStyle='rgba(255,230,212,0.9)';ctx.beginPath();ctx.arc(x,y+2,Math.max(1,2.6*(1-u))*PS*0.75,0,7);ctx.fill();}
      px=x;py=y;}
    if(e>0.95){ctx.lineWidth=3*PS*0.75;ctx.beginPath();ctx.arc(cx,cy,5,a,a+Math.PI*1.3);ctx.stroke();}
  }
}
/* ---------- 물고기 헤엄: 몸통과 꼬리가 물결치듯 ---------- */
const FISHC=new Map();
function fishSprite(sp,w,h){
  const key=sp.n+'|'+Math.round(w)+'|'+Math.round(h);let s=FISHC.get(key);if(s)return s;
  const sc=2,ox=w*0.64,oy=h*0.98,cw=Math.ceil(w*1.28*sc),ch=Math.ceil(h*1.96*sc);
  const c=document.createElement('canvas');c.width=cw;c.height=ch;
  const saved=ctx;ctx=c.getContext('2d');ctx.setTransform(sc,0,0,sc,ox*sc,oy*sc);
  try{drawFishR(sp,w,h,0,0);}finally{ctx=saved;}
  s={c,sc,ox,oy,cw,ch};FISHC.set(key,s);return s;
}
function drawFishSwim(sp,w,h,t,ph,spd){
  const S=fishSprite(sp,w,h),N=Math.max(12,Math.min(40,Math.round(w/2.5))),sw=S.cw/N,beat=t*0.26*spd+ph;
  for(let i=0;i<N;i++){
    const lx=i*sw/S.sc-S.ox,u=clamp((lx+w*0.45)/(w*0.95),0,1.15);
    const wave=beat-u*4.2,dy=Math.sin(wave)*h*0.2*u*u-Math.sin(beat)*h*0.03;
    const sy=u>0.75?1-0.32*Math.abs(Math.cos(wave))*Math.min(1,(u-0.75)/0.35):1;
    ctx.drawImage(S.c,i*sw,0,sw+0.6,S.ch,lx,-S.oy*sy+dy,sw/S.sc+0.3,S.ch/S.sc*sy);
  }
}

/* ---------- 루프 ---------- */
let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(100,now-last);last=now;
  if(G&&!G.paused&&!$('#game').hidden){acc+=dt;let n=0;while(acc>=1000/60&&n<4){step();acc-=1000/60;n++;}if(n===4)acc=0;}
  if(!$('#game').hidden)render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
